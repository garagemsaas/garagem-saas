spring:
  application:
    name: garagem-api
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/garagem}
    username: ${DATABASE_USER:garagem}
    password: ${DATABASE_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB
  flyway:
    enabled: true
server:
  tomcat:
    accesslog:
      enabled: false
  forward-headers-strategy: none
  error:
    include-message: never
    include-stacktrace: never
logging:
  level:
    root: INFO
    org.springframework.web: INFO
    org.springframework.security: INFO
    org.springframework.jdbc: INFO
    org.hibernate.SQL: WARN
    org.hibernate.orm.jdbc.bind: "OFF"
    org.apache.http.wire: "OFF"
  structured:
    format:
      console: logstash
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
app:
  jwt:
    secret: ${JWT_SECRET}
    issuer: garagem-api
  public-base-url: ${PUBLIC_BASE_URL:http://localhost:5173}
  storage:
    endpoint: ${S3_ENDPOINT:http://localhost:9000}
    region: ${S3_REGION:us-east-1}
    bucket: ${S3_BUCKET:garagem-fotos}
    access-key: ${S3_ACCESS_KEY}
    secret-key: ${S3_SECRET_KEY}
