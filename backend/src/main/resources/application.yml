spring:
  application:
    name: garagem-api
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/garagem}
    username: ${DATABASE_USER:garagem}
    password: ${DATABASE_PASSWORD}
    hikari:
      connection-timeout: ${DATABASE_CONNECTION_TIMEOUT_MS:5000}
      validation-timeout: 2000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB
  web:
    # O texto de `detail` e de `errors[].message` vem do Bean Validation, que resolve a mensagem
    # pelo locale da requisição. Sem fixar, o contêiner (sem locale definido) devolvia "must not be
    # blank" e um navegador com Accept-Language: en-US recebia inglês mesmo em servidor pt-BR — e a
    # tela mostra esse texto ao usuário final. A API é pt-BR; o locale não é negociável.
    locale: pt_BR
    locale-resolver: fixed
  flyway:
    enabled: true
server:
  tomcat:
    accesslog:
      enabled: false
  # none é o padrão seguro: impede forja de X-Forwarded-*. Atrás de proxy TLS confiável, use
  # framework — é o que faz o Spring reconhecer HTTPS e emitir HSTS.
  forward-headers-strategy: ${FORWARD_HEADERS_STRATEGY:none}
  error:
    include-message: never
    include-stacktrace: never
logging:
  level:
    root: INFO
    org.springframework.web: INFO
    org.springframework.security: INFO
    org.springframework.jdbc: INFO
    org.hibernate.SQL: WARN
    org.hibernate.orm.jdbc.bind: "OFF"
    org.apache.http.wire: "OFF"
  structured:
    format:
      console: logstash
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db,storage
  health:
    db:
      enabled: true
springdoc:
  # Em produção a documentação interativa não precisa ficar aberta: ela descreve toda a superfície
  # da API para quem ainda não autenticou. Defina API_DOCS_ENABLED=false no ambiente de produção.
  api-docs:
    enabled: ${API_DOCS_ENABLED:true}
  swagger-ui:
    enabled: ${API_DOCS_ENABLED:true}
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha
    display-request-duration: true
app:
  seguranca:
    # Teto de requisições por origem nas superfícies anônimas. Janela em duração ISO-8601.
    rate-limit:
      habilitado: ${RATE_LIMIT_ENABLED:true}
      login: ${RATE_LIMIT_LOGIN:10}
      publico: ${RATE_LIMIT_PUBLIC:60}
      janela: ${RATE_LIMIT_WINDOW:PT1M}
    # Só ligue atrás de um proxy que SOBRESCREVA X-Forwarded-For. Ligado com a porta exposta
    # direto, qualquer cliente forja o cabeçalho e escapa do teto.
    confiar-proxy: ${TRUST_PROXY:false}
  observability:
    slow-request-ms: ${SLOW_REQUEST_MS:1000}
  auth:
    # O refresh viaja em cookie HttpOnly. Frontend e API em domínios diferentes só trocam cookie com
    # SameSite=None, que por sua vez exige Secure — por isso é este o padrão. Em desenvolvimento,
    # tudo na mesma origem por http, use REFRESH_COOKIE_SECURE=false e REFRESH_COOKIE_SAME_SITE=Lax.
    refresh-cookie:
      secure: ${REFRESH_COOKIE_SECURE:true}
      same-site: ${REFRESH_COOKIE_SAME_SITE:None}
  jwt:
    secret: ${JWT_SECRET}
    issuer: garagem-api
    access-ttl: ${JWT_ACCESS_TTL:PT15M}
    refresh-ttl: ${JWT_REFRESH_TTL:P7D}
  public-link:
    ttl: ${PUBLIC_LINK_TTL:P7D}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
  public-base-url: ${PUBLIC_BASE_URL:http://localhost:5173}
  storage:
    endpoint: ${S3_ENDPOINT:http://localhost:9000}
    region: ${S3_REGION:us-east-1}
    bucket: ${S3_BUCKET:garagem-fotos}
    access-key: ${S3_ACCESS_KEY}
    secret-key: ${S3_SECRET_KEY}
