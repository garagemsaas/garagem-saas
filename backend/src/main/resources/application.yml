spring:
  application:
    name: garagem-api
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/garagem}
    username: ${DATABASE_USER:garagem}
    password: ${DATABASE_PASSWORD}
    hikari:
      connection-timeout: ${DATABASE_CONNECTION_TIMEOUT_MS:5000}
      validation-timeout: 2000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB
  web:
    # O texto de `detail` e de `errors[].message` vem do Bean Validation, que resolve a mensagem
    # pelo locale da requisição. Sem fixar, o contêiner (sem locale definido) devolvia "must not be
    # blank" e um navegador com Accept-Language: en-US recebia inglês mesmo em servidor pt-BR — e a
    # tela mostra esse texto ao usuário final. A API é pt-BR; o locale não é negociável.
    locale: pt_BR
    locale-resolver: fixed
  flyway:
    enabled: true
server:
  tomcat:
    accesslog:
      enabled: false
  forward-headers-strategy: none
  error:
    include-message: never
    include-stacktrace: never
logging:
  level:
    root: INFO
    org.springframework.web: INFO
    org.springframework.security: INFO
    org.springframework.jdbc: INFO
    org.hibernate.SQL: WARN
    org.hibernate.orm.jdbc.bind: "OFF"
    org.apache.http.wire: "OFF"
  structured:
    format:
      console: logstash
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db,storage
  health:
    db:
      enabled: true
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha
    display-request-duration: true
app:
  observability:
    slow-request-ms: ${SLOW_REQUEST_MS:1000}
  jwt:
    secret: ${JWT_SECRET}
    issuer: garagem-api
    access-ttl: ${JWT_ACCESS_TTL:PT15M}
    refresh-ttl: ${JWT_REFRESH_TTL:P7D}
  public-link:
    ttl: ${PUBLIC_LINK_TTL:P7D}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
  public-base-url: ${PUBLIC_BASE_URL:http://localhost:5173}
  storage:
    endpoint: ${S3_ENDPOINT:http://localhost:9000}
    region: ${S3_REGION:us-east-1}
    bucket: ${S3_BUCKET:garagem-fotos}
    access-key: ${S3_ACCESS_KEY}
    secret-key: ${S3_SECRET_KEY}
