name: garagem-saas
services:
  postgres:
    restart: unless-stopped
    image: postgres:17.11-alpine
    environment:
      POSTGRES_DB: garagem
      POSTGRES_USER: garagem
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?Defina DATABASE_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U garagem -d garagem"]
      interval: 5s
      timeout: 3s
      retries: 20
  minio:
    restart: unless-stopped
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z.hotfix.7aa24e772
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:?Defina S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?Defina S3_SECRET_KEY}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - fotos-data:/data
  minio-init:
    image: quay.io/minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      - minio
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET: ${S3_BUCKET:-garagem-fotos}
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        attempts=0
        until mc alias set local http://minio:9000 "$$S3_ACCESS_KEY" "$$S3_SECRET_KEY"; do
          attempts=$$((attempts + 1))
          if [ "$$attempts" -ge 30 ]; then exit 1; fi
          sleep 2
        done
        mc mb --ignore-existing "local/$$S3_BUCKET"
        mc anonymous set none "local/$$S3_BUCKET"
  api:
    restart: unless-stopped
    build: ./backend
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/garagem
      DATABASE_USER: garagem
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?Defina JWT_SECRET}
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET: ${S3_BUCKET:-garagem-fotos}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:5173}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-PT15M}
      JWT_REFRESH_TTL: ${JWT_REFRESH_TTL:-P7D}
      PUBLIC_LINK_TTL: ${PUBLIC_LINK_TTL:-P7D}
      SLOW_REQUEST_MS: ${SLOW_REQUEST_MS:-1000}
      DATABASE_CONNECTION_TIMEOUT_MS: ${DATABASE_CONNECTION_TIMEOUT_MS:-5000}
      APP_BOOTSTRAP_ENABLED: ${APP_BOOTSTRAP_ENABLED:-false}
      APP_BOOTSTRAP_SLUG: ${APP_BOOTSTRAP_SLUG:-}
      APP_BOOTSTRAP_NOME: ${APP_BOOTSTRAP_NOME:-}
      APP_BOOTSTRAP_EMAIL: ${APP_BOOTSTRAP_EMAIL:-}
      APP_BOOTSTRAP_MODULOS: ${APP_BOOTSTRAP_MODULOS:-OFICINA}
      APP_BOOTSTRAP_OPERADOR: ${APP_BOOTSTRAP_OPERADOR:-}
      APP_BOOTSTRAP_SENHA: ${APP_BOOTSTRAP_SENHA:-}
      # Cobrança. Sem PAYMENT_WEBHOOK_SECRET a aplicação recusa todo webhook, por desenho:
      # é melhor não confirmar pagamento nenhum do que aceitar um evento não autenticado.
      PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:-MANUAL}
      PAYMENT_WEBHOOK_SECRET: ${PAYMENT_WEBHOOK_SECRET:-}
      PAYMENT_GRACE_PERIOD: ${PAYMENT_GRACE_PERIOD:-P7D}
      # Teto de requisições nas superfícies anônimas.
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
      RATE_LIMIT_LOGIN: ${RATE_LIMIT_LOGIN:-10}
      RATE_LIMIT_PUBLIC: ${RATE_LIMIT_PUBLIC:-60}
      RATE_LIMIT_WEBHOOK: ${RATE_LIMIT_WEBHOOK:-120}
      RATE_LIMIT_WINDOW: ${RATE_LIMIT_WINDOW:-PT1M}
      # Atrás de proxy que sobrescreve X-Forwarded-For: liga a leitura do IP real e, junto,
      # faz o Spring reconhecer HTTPS — sem isso o HSTS nunca é emitido.
      TRUST_PROXY: ${TRUST_PROXY:-false}
      FORWARD_HEADERS_STRATEGY: ${FORWARD_HEADERS_STRATEGY:-none}
      # Documentação interativa: deixe false em produção.
      API_DOCS_ENABLED: ${API_DOCS_ENABLED:-true}
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 3s
      start_period: 60s
      retries: 6
volumes:
  postgres-data:
  fotos-data:
